# The Lean gates of the tool (vbm-land docs/lean-gates.md): which modules to audit. Its presence turns them on.
LAND_LEAN_AXIOM_IMPORTS="LeanJson LeanJsonProofs LeanJsonSimd.ParseSimd"
LAND_LEAN_AXIOM_ROOTS="LeanJson LeanJsonProofs LeanJsonSimd VbmSimd VbmSimdProofs"
LAND_LEAN_TRUST_FILES="runtime/*.c abi/*.c bindings/*/loader.*"
LAND_LEAN_TRUST_EXTERN_DIRS="LeanJson abi"
LAND_LEAN_TRUST_TOOLS="git gh mise wt flock lake leanc node cargo"
LAND_LEAN_TRUST_KEYS_CMD='lake env lean --run scripts/ClosureGate.lean --emit | awk "\$1==\"emit\" && \$2!=\"toolchain\" { print \"module:\" \$3 }"'
LAND_LEAN_RECHECK_MODULES="LeanJson LeanJsonProofs LeanJsonSimd.ParseSimd"
